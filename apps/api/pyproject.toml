[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "spendops-ai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Database
    "supabase>=2.5.0",
    # Config + validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # HTTP client (provider API calls)
    "httpx>=0.27.0",
    # Provider SDKs
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    # Billing + comms
    "stripe>=10.0.0",
    "resend>=2.0.0",
    # Observability
    "sentry-sdk[fastapi]>=2.8.0",
    "structlog>=24.2.0",
    # JWT verification for Clerk session tokens (RS256). Wraps the already-present
    # cryptography package — no new transitive deps added.
    "PyJWT[cryptography]>=2.8.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # async test client
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
    # Type stubs
    "types-pyyaml>=6.0.0",
    "types-stripe>=3.0.0",
]

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S", "B", "A", "C4", "T20", "RUF"]
ignore = [
    "S101",  # pytest uses assert
    "S105",  # hardcoded passwords in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=api --cov-report=term-missing --cov-fail-under=0"
